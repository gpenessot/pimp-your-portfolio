[project]
name = "churn-prediction-telecom"
version = "0.1.0"
description = "Prédiction de churn client pour une entreprise de télécommunications"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1.4",
    "numpy>=1.26.2",
    "scikit-learn>=1.3.2",
    "xgboost>=2.0.3",
    "imbalanced-learn>=0.11.0",
    "matplotlib>=3.8.2",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    "shap>=0.44.0",
    "mlflow>=2.9.2",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.25.0",
    "pydantic>=2.5.3",
    "python-multipart>=0.0.6",
    "streamlit>=1.29.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "gunicorn>=21.2.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.27.1",
    "pytest>=7.4.3",
    "black>=23.12.1",
    "flake8>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
